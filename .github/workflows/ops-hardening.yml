name: Fleet ops hardening

on:
  push:
    paths:
      - "tools/cron-roles/**"
      - "tools/content-guardrails/**"
      - "sites/**"
  pull_request:
    paths:
      - "tools/cron-roles/**"
      - "tools/content-guardrails/**"
      - "sites/**"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run fleet ops contracts
        run: bash tools/cron-roles/tests/test_ops_hardening.test.sh
      - name: Audit SEO role turn-budget headroom
        run: python3 tools/cron-roles/tests/test_seo_role_turn_budget.py
