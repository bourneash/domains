name: Security and Build

# Verify-only. Builds and deploys are handled by Cloudflare Workers Builds
# (Git integration on the Worker). No untrusted GitHub event fields are
# referenced in any run: block - only fixed npm commands run here.

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: site

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+)
        run: npm run security:audit

      - name: Build
        run: npm run build
