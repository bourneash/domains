<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set data-theme before first paint to avoid a flash. Mirrors src/ui/theme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ts_theme");
          document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TrainingSharks — a free browser poker trainer that computes every answer instead of looking it up. Drill equity and pot-odds decisions graded in chips, play exploitable opponents, and get a leak report priced in big blinds." />
    <meta name="theme-color" content="#05090c" />
    <link rel="canonical" href="https://trainingsharks.com/" />
    <meta property="og:title" content="TrainingSharks — a poker trainer that computes the answer" />
    <meta property="og:description" content="Free browser poker trainer. Every answer computed in WebAssembly, every mistake priced in big blinds. Play money only." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trainingsharks.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2305090c'/><path d='M50 16 C 61 38, 77 62, 88 80 C 68 74, 44 74, 12 86 C 32 66, 45 40, 50 16 Z' fill='%234fd1c5'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>TrainingSharks — poker training that shows its working</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TrainingSharks",
        "url": "https://trainingsharks.com/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (browser-based)",
        "description": "A free poker trainer that computes equity and expected value in the browser. Drill decisions, play against exploitable opponents, and track leaks priced in big blinds. Play money only.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
