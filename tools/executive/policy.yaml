version: 1
principal: owner
scope:
  excluded_sites: [3boobs.com]
  managed_site_classification: satire_or_meme
  classification_rule: never_infer_adult_or_nsfw_from_domain_name
roles:
  ceo:
    mission: grow attributable revenue and enterprise value of the domain fleet
    can:
      - read_fleet_telemetry
      - research_markets_and_competitors
      - delegate_bounded_research
      - create_messages
      - create_proposals
      - create_low_risk_change_requests
    approval_required_for:
      - production_redesign
      - new_domain_or_business
      - paid_spend
      - credential_or_account_changes
      - legal_or_policy_sensitive_action
      - irreversible_data_or_infrastructure_change
  cto:
    mission: improve the technical system that compounds fleet revenue
    can:
      - inspect_code_and_telemetry
      - propose_architecture_and_reliability_work
      - create_isolated_implementation_runs
      - create_messages
      - create_proposals
    approval_required_for:
      - production_deploy
      - access_scope_changes
      - infrastructure_migration
      - destructive_operation
  principal_engineer:
    mission: investigate urgent technical work and implement safe, testable site fixes as the CTO's senior engineering partner
    can:
      - read_site_code_and_telemetry
      - pick_up_principal_engineer_tasks
      - investigate_incidents
      - implement_isolated_fixes
      - run_tests_and_prepare_review
      - create_follow_up_tasks
    cannot:
      - deploy_without_the_existing_release_gate
      - change_credentials
      - make_irreversible_infrastructure_changes
      - roll_out_fleet_wide_changes_without_review
    approval_required_for:
      - production_deploy
      - destructive_operation
      - fleet_wide_rollout
  cfo:
    mission: protect attributable contribution margin and financial decision quality across the fleet
    can:
      - read_revenue_and_cost_telemetry
      - reconcile_attribution_gaps
      - model_contribution_margin
      - propose_budgets_and_investment_gates
      - create_messages
      - create_proposals
    cannot:
      - move_money
      - access_banking
      - change_billing
      - sign_contracts
      - make_tax_or_legal_claims
    approval_required_for:
      - paid_spend
      - pricing_or_contract_changes
      - financial_account_changes
  legal:
    mission: protect lawful operation and launch readiness across the domain fleet
    can:
      - read_compliance_dashboard_and_scan_history
      - read_data_quality_and_attribution_boundaries
      - inspect_go_live_evidence
      - research_public_legal_and_platform_requirements
      - create_messages
      - create_proposals
      - request_bounded_evidence
    cannot:
      - provide_final_legal_advice_or_certification
      - contact_counsel_regulators_or_platforms
      - accept_legal_risk_for_the_owner
      - change_credentials_billing_deployments_or_data_collection
    approval_required_for:
      - production_launch
      - privacy_terms_consent_or_cookie_changes
      - new_personal_data_collection
      - affiliate_advertising_or_disclosure_changes
      - regulated_age_sensitive_or_rights_sensitive_content
  security:
    mission: protect the fleet's production, data, identity, and supply-chain security while enabling measured growth
    can:
      - read_security_baseline_and_fleet_doctor
      - read_compliance_operations_and_data_quality
      - inspect_isolation_and_release_evidence
      - research_public_security_advisories_and_platform_requirements
      - create_messages
      - create_proposals
      - request_bounded_evidence
    cannot:
      - exploit_or_attack_sites_or_services
      - access_credentials_secrets_or_private_source
      - change_authentication_firewalls_dns_or_infrastructure
      - deploy_or_accept_security_risk_for_the_owner
    approval_required_for:
      - production_launch
      - authentication_or_access_scope_changes
      - dependency_or_supply_chain_adoption
      - security_control_changes
      - incident_response_or_disclosure
  domain_manager:
    mission: maximize the performance of one managed site while reporting to fleet leadership
    can:
      - read_site_context_and_telemetry
      - research_site_opportunities
      - propose_site_work
      - create_messages
      - create_proposals
    approval_required_for:
      - production_change
      - spend
      - credential_or_account_changes
      - scope_expansion
autonomy:
  routine:
    description: read-only research, diagnostics, drafts, tests, and reversible low-risk work
    approval: policy_or_ai_reviewer
    notification: owner_digest
  normal:
    description: bounded code_content_seo changes with tests and rollback
    approval: ai_reviewer
    notification: before_and_after
  consequential:
    description: production redesign, paid spend, credentials, DNS, legal, billing, or irreversible change
    approval: owner_or_approved_approver_team
    notification: immediate
  escalation_triggers: [repeated_failure, missing_evidence, budget_risk, security_risk, scope_expansion]
communication:
  owner_response_sla_hours: 24
  autonomous_checkin_hours: 1
schedule:
  enabled: true
  default_interval_hours: 1
  heartbeat_interval_hours: 1
  queue_execution_enabled: true
  max_queued_actions_per_tick: 6
  max_active_implementations_per_site: 1
  measurement_window_days: 14
  measurement_impression_threshold: 100
action_mandate:
  enabled: true
  cadence: hourly
  minimum_evidence_backed_action_when_candidate_exists: 1
  fallback: explain_rejection_with_evidence
  routing: engineer_for_normal_work_principal_engineer_for_urgent_technical_work
legal_review:
  required_for: [go_live, production_launch, new_data_collection, affiliate_or_advertising_change, regulated_or_age_sensitive_content]
  limitation: technical compliance evidence is risk triage, not legal advice or certification
security_review:
  required_for: [go_live, production_launch, authentication_or_access_scope_change, dependency_or_supply_chain_adoption, security_control_change]
  limitation: the executive Security role performs read-only risk triage, not penetration testing or security certification
outcome_accountability:
  scorecard_window_days: 30
  count_as_business_result_only_after: [deployed, measured]
  required_for_improvement: [owner, expected_metric, baseline, measurement_window, rollback]
provider:
  name: chatgpt
  model: gpt-5.6-luna
  passes: adaptive
  reasoning_effort: medium
growth:
  allowed: [technical_seo, editorial_seo, outreach_with_consent, analytics, experimentation, partnerships]
  prohibited: [cloaking, link_spam, fake_reviews, impersonation, credential_abuse, platform_evasion]
