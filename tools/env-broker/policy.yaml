# env-broker policy — which secrets each site container is allowed to see.
#
# THIS FILE HOLDS NO SECRETS. It is the allowlist; the values live in
# Vaultwarden (collection "Fleet Env"), with the shared root .env as the
# bootstrap/fallback source. Policy in git, secrets in the vault.
#
# WHY THIS EXISTS
# Every site cron container used to mount the whole fleet .env — 60 keys
# including CLOUDFLARE_API_TOKEN, GITHUB_TOKEN, SLACK_BOT_TOKEN, the Amazon
# Creators secret, the PIA password and FD_TOKEN (the Fleet Dashboard operator
# token). Those containers run `claude -p` over attacker-influenced input
# (scraped feeds, product pages, social replies). One prompt injection in any
# one site meant the whole fleet: push to 48 repos, redeploy every worker,
# drive the dashboard, spend the Amazon account.
#
# Measured against what the ops trees actually reference, a typical site needs
# FOUR of those 60 keys. 25 of them are referenced by no site at all.
#
# HOW A SITE'S KEY SET IS BUILT
#   1. `defaults.keys`
#   2. its own SLACK_CHANNEL_* var (derived from registry/fleet.yaml's
#      slack_channel_env, so the many irregular names — SLACK_CHANNEL_RC9,
#      SLACK_CHANNEL_AMERICA_STRIKES, SLACK_CHANNEL_AMPUTEENEWS_COM — stay
#      single-sourced rather than re-guessed here)
#   3. `sites.<domain>.extra_keys`
#   4. minus `sites.<domain>.deny_keys`
#
# `env_broker.py --check` re-derives what each site's ops/ actually references
# and fails on drift in either direction: a key a site needs but is not
# granted (would break a role), or a key granted but unreferenced (needless
# blast radius). Run it after touching any ops script.

defaults:
  keys:
    # Deploy verification hits /accounts/<id>/workers/... — account-scoped, so
    # a per-zone token cannot replace it. That is what tools/cf-broker exists
    # to fix: it performs those reads host-side and the container authenticates
    # with CF_BROKER_TOKEN instead. CF_BROKER_TOKEN is NOT a default — the
    # broker rollout is a one-site canary (xxxtea.com, via its own
    # extra_keys), so granting it fleet-wide would be 33 sites carrying an
    # unused credential, the exact problem this policy exists to avoid. Add a
    # site's own extra_keys entry as it migrates onto the broker; drop
    # CLOUDFLARE_API_TOKEN via deny_keys once it does.
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
    - SLACK_BOT_TOKEN

# Keys whose value differs PER SITE. Sourced from that site's own vault item
# (`fleet — site-<domain>`), falling back to the fleet-wide value when the site
# has none. Cloudflare's model is why: a token can be scoped to one zone, so a
# compromised container can no longer touch another site's DNS. It canNOT be
# scoped to one Worker (`Workers Scripts Write` exists only at account scope —
# verified against all 395 permission groups on 2026-09-01), so this is a real
# reduction in blast radius, not a fix for it. Mint with tools/cf-tokens.
per_site_vault:
  - CLOUDFLARE_API_TOKEN
  # Authenticates a container to tools/cf-broker, which performs the Cloudflare
  # READS deploy.sh needs and holds the Cloudflare credential itself. The broker
  # derives the site from this token, so it is also the container's identity —
  # which is why it must be per-site and never fleet-wide.
  - CF_BROKER_TOKEN

# Keys with no home in the shared .env — Vaultwarden is their only source.
# FD_TOKEN gates the Fleet Dashboard, which can push to every repo, redeploy
# every worker and drive the host's Docker socket. Parking it in the same
# bootstrap file as 60 other keys is what made the gate decorative (B2); it now
# lives in the vault and reaches exactly one rendered file. These keys are read
# from the vault whatever --source says, and a target missing one is NOT
# written — a vault outage must leave the last good render in place, never
# blank the credential.
vault_only:
  - FD_TOKEN
  # Shared only by the Social Hub API and its Fleet Dashboard proxy. Keeping
  # it out of .env makes a diagnostic/source-tree read insufficient to drive
  # the public publishing control plane.
  - SOCIAL_HUB_TOKEN
  # Mints the per-site Cloudflare tokens. It can create tokens carrying any
  # permission it holds, so a container that could read it could grant itself
  # account-wide Workers + DNS — strictly worse than the fleet token this whole
  # exercise exists to retire. Host provisioning path only; never rendered.
  - CLOUDFLARE_PROVISION_TOKEN

# Keys no site may ever receive, whatever else says. Belt to the allowlist's
# braces: these are the fleet-wide credentials whose leak is unrecoverable.
never_grant:
  - GITHUB_TOKEN
  - CLOUDFLARE_PROVISION_TOKEN
  - FD_TOKEN
  - FD_AUTH
  - AMAZON_CREATORS_KEY_ID
  - AMAZON_CREATORS_KEY_SECRET
  - AMAZON_CREATORS_APPLICATION_ID
  - AMAZON_CREATORS_VERSION
  - AMAZON_ASSOCIATES_STORE_ID
  - VPN_PIA_USERNAME
  - VPN_PIA_PASSWORD
  - CF_ACCESS_KEY_ID
  - CF_SECRET_ACCESS_KEY      # B13 fixed 2026-08-25: key renamed in the live .env
  - CF_S3_API_ENDPOINT
  - CF_API_TOKEN
  - CF_ACCOUNT_ID
  - ED_USERNAME
  - ED_PASSWORD
  - RESEND_API_KEY

sites:
  americastrikes.com:
    extra_keys: [DVIDS_API_KEY, PEXELS_API_KEY, UNSPLASH_ACCESS_KEY]
  saveusfarms.com:
    extra_keys: [PEXELS_API_KEY, UNSPLASH_ACCESS_KEY]
  amputeenews.com:
    # Public RUM beacon token — shipped to browsers, not a secret.
    # NOTE: deny_keys [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID] removed
    # 2026-08-27 — ops/scripts/deploy.sh now calls `wrangler deploy` and needs
    # both (see defaults.keys). The deny predated that script.
    extra_keys: [PUBLIC_CF_BEACON_TOKEN]
  allthingsmasonic.com:
    deny_keys: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
  newmomshop.com:
    deny_keys: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
  weirdgirlstore.com:
    deny_keys: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
  xxxtea.com:
    # CANARY for tools/cf-broker (B1 step 2): deploy.sh now asks the broker for
    # build status instead of Cloudflare, so this container holds no Cloudflare
    # credential at all. That is the part per-site tokens could not fix —
    # `Workers Scripts Write` is account-scope-only, so any site's token can
    # deploy any of the 57 workers. Roll the rest of the fleet behind this one.
    extra_keys: [CF_BROKER_TOKEN]
    deny_keys: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
  weirdassstuff.com:
    deny_keys: [CLOUDFLARE_ACCOUNT_ID]
  # No deny_keys: 2026-08-26 ops standup gave this site real scripts
  # (deploy.sh polls the CF Workers Builds API; every role notifies via
  # notify-slack.sh) that need the defaults. The original deny_keys here (from
  # this policy's first commit) was a byproduct of measuring an EMPTY ops/
  # tree, not a deliberate security decision — see `env_broker.py --check`.

# Tool containers under tools/. Not sites: no defaults, no Slack-channel
# derivation, just an explicit list of what each one is measured to use.
# Before this they mounted the same 61-key file the sites did, which meant the
# Amazon collector could read the Cloudflare token, the GitHub collector could
# read the Amazon secret, and all three could read FD_TOKEN — the Fleet
# Dashboard operator token.
tools:
  amz-stats:
    keys:
      - AMAZON_ASSOCIATES_STORE_ID
      - AMAZON_CREATORS_APPLICATION_ID
      - AMAZON_CREATORS_KEY_ID
      - AMAZON_CREATORS_KEY_SECRET
      - AMAZON_CREATORS_VERSION   # config, not a secret; read by the Creators client
      - SLACK_BOT_TOKEN
  cf-broker:
    # Holds the account-scoped token ON BEHALF OF the site containers,
    # which is the entire point: they stop holding one.
    keys: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
  cf-stats:
    keys: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
  fleet-dashboard:
    # The panel's own auth gate + the social-hub token it forwards. FD_AUTH is a
    # flag, not a secret, but it is interpolated by the same compose file so it
    # rides along rather than keeping a second env source alive.
    keys: [FD_TOKEN, FD_AUTH, SOCIAL_HUB_TOKEN]
  social-hub:
    keys: [SOCIAL_HUB_TOKEN]
  gh-stats:
    keys: [GITHUB_TOKEN]
  site-tracker:
    keys:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
      - GITHUB_TOKEN
      - SLACK_BOT_TOKEN
      - RESEND_API_KEY

# Vault layout. Grouped by provider rather than one 60-field blob so a single
# provider can be rotated (and later scoped to its own collection) without
# touching the rest.
vault:
  collection: Fleet Env
  groups:
    cloudflare:  [CLOUDFLARE_, CF_, PUBLIC_CF_]
    slack:       [SLACK_, DATAHUB_IMAGES_ALERT_CHANNEL]
    amazon:      [AMAZON_]
    media-apis:  [UNSPLASH_, PEXELS_, PIXABAY_, DVIDS_]
    vpn:         [VPN_]
    github:      [GITHUB_]
    dashboard:   [FD_, SOCIAL_HUB_]
    email:       [RESEND_, ED_]
