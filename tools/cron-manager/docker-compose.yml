name: cron-manager

services:
  panel:
    build: .
    image: cron-manager:latest
    container_name: cron-manager
    restart: unless-stopped
    # Loopback-only publish — same posture as domain-developer.
    ports:
      - "127.0.0.1:4753:4753"
    environment:
      # The repo root, bind-mounted at the SAME path inside the container so
      # `docker compose build/up` for a site resolves its volume sources.
      CM_DOMAINS_ROOT: ${HOME:-/home/jesse}/projects/domains
      CM_HOST: 0.0.0.0
      # Must match the HOST's HOME. Site compose files mount the shared
      # creds via ${HOME}/projects/domains/.env; when cron-manager spawns
      # `docker compose up cron` for a site, that ${HOME} is resolved by the
      # CLI running INSIDE this container. Without this, HOME=/root here and
      # the bind source becomes /root/projects/domains/.env (nonexistent on
      # the host), so the container init fails and is left in `Created`.
      HOME: ${HOME:-/home/jesse}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME:-/home/jesse}/projects/domains:${HOME:-/home/jesse}/projects/domains
      - ${HOME:-/home/jesse}/.docker:${HOME:-/home/jesse}/.docker
    working_dir: ${HOME:-/home/jesse}/projects/domains/tools/cron-manager
