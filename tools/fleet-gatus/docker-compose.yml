# tools/fleet-gatus/docker-compose.yml
#
# Gatus as the fleet's health-check dashboard + alerting layer, fleet-wide
# (see scripts/generate_config.py). Threshold-based Slack alerting — only
# fires on real state changes, not every tick — plus a glanceable status
# dashboard, also surfaced natively in fleet-dashboard's Health tab.
name: fleet-gatus

services:
  # Groups Gatus's per-endpoint alerts into one message per site before they
  # reach Slack, and names the cause class in plain English. See relay/relay.js
  # for the incident that motivated it. fleet-gatus posts SITE alerts here;
  # internal-service alerts still go straight to Slack so this container's own
  # health check does not depend on this container.
  alert-relay:
    build: ./relay
    image: fleet-alert-relay:latest
    container_name: fleet-alert-relay
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - TZ=America/New_York
      # Long enough to catch every endpoint of one site in a single Gatus tick
      # (they are evaluated within a second or two of each other), short enough
      # that a real outage is still reported promptly.
      - RELAY_WINDOW_MS=45000
    # No published port: only fleet-gatus needs to reach it, by container name.
    networks:
      - default

  fleet-gatus:
    image: twinproduction/gatus:stable
    container_name: fleet-gatus
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:8580:8080"   # loopback only — no auth in front of it yet
    depends_on:
      - alert-relay
    volumes:
      - ./config:/config:ro
      - ./data:/data
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
      - TZ=America/New_York
    # Host-network services (media-gen-api binds 0.0.0.0:4780 on the host)
    # have no container name to resolve — reach them through the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      # Shared with fleet-dashboard (tools/fleet-dashboard/docker-compose.yml)
      # so the panel container can reach this one by container name
      # (http://fleet-gatus:8080/...) instead of the host's loopback, which
      # is a different network namespace from inside another container.
      # Also how the fleet-internal checks reach fleet-dashboard, datahub-api
      # and datahub-images-api.
      - vpn_proxy
      # Joined solely so the fleet-internal checks can reach these two by
      # container name; their ports are published on the host's loopback only,
      # which is unreachable from inside another container.
      - product_feed
      - domain_developer

networks:
  default:
  vpn_proxy:
    external: true
    name: vpn-proxy_default
  product_feed:
    external: true
    name: product-feed_default
  domain_developer:
    external: true
    name: domain-developer_default
