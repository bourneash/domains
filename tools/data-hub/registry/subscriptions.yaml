---
# data-hub subscription registry — one entry per subscriber site.
# Each subscription defines which items the site's puller should fetch
# from the shared item store via GET /subscriptions/{site}/items.

subscriptions:

  americastrikes.com:
    items:
      tags_any: [defense, iran, diplomacy, markets, domestic, world]
      limit: 200
      window_hours: 48

  aliencouncil.com:
    items:
      tags_any: [uap, disclosure, sighting, military, science, space, weird]
      limit: 100
      window_hours: 72

  broadwayshowgirls.com:
    items:
      tags_any: [theater, musicals, awards, industry]
      limit: 50
      window_hours: 168

  saveusfarms.com:
    items:
      # Already matches the full ag corpus; the 48h window was the bottleneck
      # (~5 items/48h vs ~115/168h). Widened to 168h (= the data retention
      # horizon) to give the War Room desk a fuller feed.
      tags_any: [agriculture, food-policy, farm-economy, land, environment]
      limit: 200
      window_hours: 168
    datasets: [corn-yield, diesel]

  sinderella.org:
    items:
      tags_any: [space, science, weird, nature]
      limit: 60
      window_hours: 24
    datasets: [ephemeris, kindex, solar-xrays, weather-alerts, quakes, launches]
