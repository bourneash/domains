# Fleet-level cron driver — see README.md and ../HANDOFF.md.
#
# Bring up:  cd tools/fleet-cron && docker compose --env-file ../../.env up -d
# Logs:      docker compose logs -f cron
# Edit sched:vi crontab.docker && docker compose restart cron  (no rebuild — bind-mounted)
# Rebuild:   docker compose build cron  (only needed after Dockerfile/entrypoint changes)

name: fleet-cron

services:
  cron:
    build: .
    image: fleet-cron:latest
    container_name: fleet-cron
    # Socket access comes from group membership, not capabilities — verified
    # across this fleet, including containers that drive the docker socket.
    cap_drop:
      - ALL
    restart: unless-stopped
    # Same tier-1 liveness every site cron container carries: supercronic is
    # PID 1 (entrypoint.sh exec's it), so reading /proc/1/comm is exact, spawns
    # no process, and cannot match the probe itself the way `pgrep -f` did.
    #
    # This container matters more than any single site's: it runs the sweeps —
    # including cron-freshness (job 15) — that notice when the OTHER schedulers
    # stop. Honest limit: tier 2 cannot cover this container, because a wedged
    # fleet-cron is exactly the thing that would fail to run the sweep that
    # would have reported it. Tier 1 + autoheal covers the DEAD case unattended;
    # the wedged case still needs an out-of-band checker and does not have one.
    healthcheck:
      test: ["CMD", "grep", "-qx", "supercronic", "/proc/1/comm"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # Docker never restarts a container for going unhealthy — vpn-autoheal
      # (tools/vpn-proxy) is what turns unhealthy into a restart.
      autoheal: "true"
    security_opt:
      - no-new-privileges:true
    volumes:
      # A writable home at the HOST's home path (see HOME env below), owned
      # by ops (Dockerfile pre-creates + chowns it). Without this, Docker
      # auto-creates /home/jesse as an implicit root-owned mount parent for
      # the sub-binds below, and job 4's `claude -p` can't write its own
      # state (~/.claude.json) — it hangs until AUTH_CHECK_TIMEOUT instead of
      # failing fast. The more specific binds below (.ssh, credentials,
      # projects/domains) layer on top of this volume normally.
      - fleet_cron_home:${HOME:-/home/jesse}
      # Mount the docker socket so this container can invoke `docker compose
      # up` / `docker exec` / `docker inspect` against every other fleet
      # container. RW — compose v2 breaks with :ro.
      - /var/run/docker.sock:/var/run/docker.sock
      # CRITICAL: bind the repo at the SAME absolute path as the host. Jobs 1
      # and 3 invoke `docker compose up`/`docker inspect` for OTHER sites'
      # containers from inside this one — the daemon (host-side) resolves
      # those compose files' bind specs against the host filesystem, so `.`
      # inside a site's docker-compose.yml only resolves correctly if this
      # container sees that site at the identical path. Same reasoning as
      # every site's own cron container (see ops/docker/docker-compose.yml
      # under sites/americastrikes.com for the canonical comment).
      - ${DOMAINS_ROOT:-/home/jesse/projects/domains}:${DOMAINS_ROOT:-/home/jesse/projects/domains}
      # Docker config dir — job 1 (ensure-fleet-cron.sh) and job 6
      # (domain-job-runner.sh -> full-bootstrap.sh) can trigger `docker
      # compose build` from inside this container; without this mounted,
      # that fails with "mkdir ~/.docker: permission denied".
      - ${HOME:-/home/jesse}/.docker:${HOME:-/home/jesse}/.docker
      # SSH identity for job 6's `git submodule add` / push (github-bourneash
      # alias) — mounted at the same absolute path as HOME below, not at
      # /home/ops, so it resolves whether a script reads it via `~` (which
      # follows $HOME) or an absolute host path.
      - ${HOME:-/home/jesse}/.ssh:${HOME:-/home/jesse}/.ssh:ro
      # Shared Claude Code OAuth session — job 4 probes this directly, RO.
      # This directory also exposes .credentials.lock, so the probe can join
      # claude-tracked.sh's cross-container OAuth refresh mutex.
      # Mount the full ~/.claude DIRECTORY, not just the credentials file.
      # A single-file bind pins to the inode present at container start; the
      # host daemon rotates the token via atomic write-temp+rename (~every
      # 8h), so the file bind silently went stale on any long-lived
      # container and job 4 alerted on a false "auth revoked" for hours
      # while the host's real session was fine (2026-08-16 incident).
      # Directory binds resolve renames live, so this can't go stale again.
      # Wider read surface than the single file (other projects' session
      # transcripts, MCP OAuth tokens, settings.json) — accepted: this
      # container already mounts /var/run/docker.sock RW, which is
      # host-root-equivalent, so this isn't a meaningful blast-radius
      # increase, and fleet-dashboard already runs this exact pattern.
      - ${HOME:-/home/jesse}/.claude:${HOME:-/home/jesse}/.claude:ro
      # The schedule itself — bind-mounted live, NOT baked into the image.
      # Edit this file + `docker compose restart cron` takes effect
      # immediately; no rebuild. See the crontab.docker header comment.
      - ./crontab.docker:/etc/crontab.docker:ro
      # Vaultwarden creds store — job 14 (env-broker-check-cron.sh) shells
      # out to `bw` via tools/social-lib's vault_store.py. Same pattern as
      # sites/americastrikes.com's docker-compose.yml: read-only, session
      # cache redirected below since the mount itself can't be written to.
      # Without this, `bw` fails to find automation-account.env / the TLS
      # cert and every vault read silently falls back to fleet-wide creds
      # (2026-09-03 incident — this mount was simply never added).
      - /mnt/encrypted/projects/credential-vault:/mnt/encrypted/projects/credential-vault:ro
    working_dir: ${DOMAINS_ROOT:-/home/jesse/projects/domains}
    environment:
      TZ: America/New_York
      # HOME must match the HOST's HOME (not the container's native
      # /home/ops) — see the .ssh/.credentials mount comment above and the
      # docker-compose-up-for-other-sites comment. This is the same override
      # every site's cron container already applies.
      HOME: ${HOME:-/home/jesse}
      FLEET_DOMAINS_ROOT: ${DOMAINS_ROOT:-/home/jesse/projects/domains}
      # Reach Vaultwarden by container name over the shared vpn-proxy network
      # (see `networks:` below) — "localhost" inside this container is the
      # container itself, not the host's published 127.0.0.1:9280 (that port
      # is loopback-only on the host anyway, so host.docker.internal can't
      # reach it either).
      #
      # KNOWN LIMITATION, not fixed by this change: the vault's self-signed
      # cert (/mnt/encrypted/projects/credential-vault/ssl/cert.pem) only
      # carries SANs for `localhost` / `127.0.0.1`. Connecting by container
      # name passes network reachability but fails TLS hostname verification
      # ("Hostname/IP does not match certificate's altnames") — `bw login`
      # fails and env-broker's per-site vault reads still fall back to
      # fleet-wide values, now for that reason instead of a missing mount.
      # This affects every container-side `bw` user on this network, not
      # just fleet-cron (sites/americastrikes.com's docker-compose.yml sets
      # this exact VAULT_SERVER already). Fixing it for real means either
      # reissuing the vault's cert with the extra SAN(s) containers connect
      # through, or keeping env-broker host-side per its own header comment
      # ("Containers do not talk to the vault"). Flagged, not decided here.
      VAULT_SERVER: "https://credential-vault:80"
      # The vault mount above is read-only; redirect the session-cache write
      # into the writable fleet_cron_home volume instead.
      VAULT_SESSION_CACHE_FILE: "${HOME:-/home/jesse}/.fleet-cron-vault-session-cache"
    networks: [default, vpn_proxy]
    depends_on: []

networks:
  default:
  vpn_proxy:
    external: true
    name: vpn-proxy_default

volumes:
  fleet_cron_home:
