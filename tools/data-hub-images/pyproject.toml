[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-images"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pyyaml>=6", "Pillow>=10.3", "imagehash>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits real network through the VPN (opt-in)"]
addopts = ["-m", "not live"]

[tool.setuptools.packages.find]
where = ["src"]
