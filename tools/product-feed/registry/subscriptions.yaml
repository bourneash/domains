# tools/product-feed/registry/subscriptions.yaml
#
# One entry per site that reviews products from the shared inventory.
# `tags_any` controls which verified products the site may choose from.
#
# `target_available_depth` tells the central collector how many unreviewed,
# matching products to keep available for this site. The same shared product
# remains independently reviewable by every matching site.
#
# `review_batch_size` is the normal number claimed by that site's scout.
# `max_queue_depth` is retained for the legacy candidate API only.
#
# Adding a new site: see the product-feed-onboard-site skill. It walks
# through picking tags, deciding whether to share or stay exclusive, and
# wiring the site's own producer/consumer scripts.

weirdgirlstore.com:
  tags_any: [weird, weirdgirl, gothic, occult, macabre, decor, wearable, collectibles]
  max_queue_depth: 12
  target_available_depth: 24
  review_batch_size: 4

weirdassstuff.com:
  tags_any: [weird, novelty, gag-gifts, kitchen-chaos, bathroom-bizarre, desk-weird, pet-oddities, wearable-wtf, party-games, home-decor-weird, tech-oddities]
  max_queue_depth: 14
  target_available_depth: 28
  review_batch_size: 6
