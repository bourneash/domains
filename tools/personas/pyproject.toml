# tools/personas/pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "social-lib @ file:///home/jesse/projects/domains/tools/social-lib",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[project.scripts]
persona = "personas.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
