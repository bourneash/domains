registry:
  # Relative to the site repository. Sites with a frontmatter product registry
  # override this with e.g. `site/src/content/products`.
  path: site/src/lib/affiliate.ts

checks:
  prime_required: true
  min_rating: 4.0
  oos_grace_runs: 2
  dead_grace_runs: 1
  broken_redirect_grace_runs: 1
  no_prime_grace_runs: 2
  low_rating_grace_runs: 2
  inconclusive_grace_runs: 3  # consecutive anti-bot/5xx reads before escalating to a human task
pacing:
  min_delay_s: 12
  max_delay_s: 25
resolution:
  # Tightened 2026-07-29 after the totaljerks pilot's first real run: 5 of 6
  # flagged products hit max_agent_turns without finishing (each search+verify
  # round trip through CloakBrowser costs several turns; 3 attempts routinely
  # blew the budget). Scoping to 1 attempt makes each invocation reliably fit
  # its budget — "couldn't find a confident replacement quickly, file a task
  # for a human" is a perfectly fine normal outcome, not a failure to
  # engineer around with more turns/search attempts.
  max_search_attempts: 1
  max_agent_turns: 20
  model: claude-sonnet-4-6
slack:
  channel_env: SLACK_CHANNEL_TOTALJERKS
  channel_default: null
