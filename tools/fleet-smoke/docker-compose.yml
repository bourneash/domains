# tools/fleet-smoke/docker-compose.yml
name: fleet-smoke

services:
  fleet-smoke-cron:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fleet-smoke-cron:latest
    # container_name matches the tools/<slug> directory name — this is the
    # convention tools/fleet-dashboard's cron discovery relies on for `tools/*`
    # entries (it assumes container === slug, unlike the `sites/*` convention
    # which reads the real container_name out of docker-compose.yml).
    container_name: fleet-smoke
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - TZ=America/New_York
    volumes:
      # Every site's ops/smoke.yaml, read-only — the fleet tool never writes
      # into a site's own repo.
      - ../../sites:/fleet-sites:ro
      # Per-site last-run fail counts — the only writable state, and it lives
      # here (not in any site's repo).
      - ./state:/fleet/state
