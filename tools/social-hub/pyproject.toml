# tools/social-hub/pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-hub"
version = "1.0.0"
description = "Fleet social media management platform — content queue, scheduler, AI drafting, reply inbox, HTTP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
    "atproto>=0.0.50",
    "tweepy>=4.14",
    "praw>=7.7",
    "social-lib @ file:///home/jesse/projects/domains/tools/social-lib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
social-hub = "social_hub.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
social_hub = ["../../config/*.yaml"]
