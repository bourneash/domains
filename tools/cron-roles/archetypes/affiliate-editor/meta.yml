# ┌──────────────────────────────────────────────────────────────────────────┐
# │ RETIRED 2026-08-25 — do NOT install this archetype on a new site.        │
# │                                                                          │
# │ Superseded by tools/affiliate-sentinel: host-side, daily, Creators API   │
# │ for product liveness + a direct /go/ fetch for cloak health. This one    │
# │ curled every link through to Amazon and grepped for soft-404 strings,    │
# │ so a large permanent share of every run came back "inconclusive — Robot  │
# │ Check" (Amazon walls datacenter IPs) and liveness rode on brittle        │
# │ English markers.                                                         │
# │                                                                          │
# │ Kept only so the 15 sites that still carry run-affiliate-editor.sh have  │
# │ a documented manual fallback for when the Amazon API is unavailable.     │
# │ It is unscheduled everywhere. See the domains-cron-role-affiliate-editor │
# │ skill for how to onboard a site now (one host crontab entry).            │
# └──────────────────────────────────────────────────────────────────────────┘
retired: true
retired_on: "2026-08-25"
superseded_by: tools/affiliate-sentinel

name: affiliate-editor
# Selected: reviewtattoo.com/affiliate-tester (scored 17/18 — pure no-deploy sentinel,
# crisp headless contract, anti-bot-wall false-positive guard). Grafted: wetpages
# build-gate validator rigor; xxxtea explicit engineering handoff.
source: reviewtattoo.com/affiliate-tester
schedule: "0 7 * * 3"            # Wed 7am — 2-3 day buffer before weekend content runs
model: none                      # ZERO-AI as of 2026-08-23 — deterministic sentinel, see scripts/
owns_task_types: [affiliate]
produces_task_types: [content, engineering]   # dead ASIN -> content; broken /go/ redirect -> engineering
worker_deps: []                  # curl-based; no headless browser
needs_rebuild_verify: true       # crontab.docker is baked into the cron image
self_notifies: true              # role posts to Slack itself via notify-slack.sh (## Notify section)
deploy: false                    # NO-DEPLOY sentinel — only files tasks
scripts: [run-affiliate-editor.sh]
gitignore: []
placeholders: [BASE_URL, SITE_BRAND, GO_PREFIX, AFFILIATE_TAG, CONTENT_PATH, SLACK_CHANNEL_VAR, SLACK_CHANNEL_DEFAULT, MODEL]
placeholder_detection:
  BASE_URL: "live site URL https://<domain> — from astro.config or CLAUDE.md (ignore amazon URLs)"
  SITE_BRAND: "on-page brand string from header/footer"
  GO_PREFIX: "affiliate cloak path, default /go/ — confirm via site/public/_redirects"
  AFFILIATE_TAG: "Amazon Associates tag, e.g. <brand>-20 — from site/src/lib/affiliate.ts"
  CONTENT_PATH: "dir to grep for pages referencing a dead id — e.g. site/src/content/guides/ or site/src/pages/reviews/"
  SLACK_CHANNEL_VAR: "SLACK_CHANNEL_* var name from run-role.sh"
  SLACK_CHANNEL_DEFAULT: "fallback channel, e.g. domain-<short>-com"
  MODEL: "claude-sonnet-4-6"
