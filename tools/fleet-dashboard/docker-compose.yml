name: fleet-dashboard

services:
  panel:
    build: .
    image: fleet-dashboard:latest
    container_name: fleet-dashboard
    restart: unless-stopped
    # uid 1000 needs the host docker group to read /var/run/docker.sock
    # (root:docker on the host). Same pattern the site cron containers use.
    group_add:
      # No numeric fallback: a plausible-but-wrong GID makes the panel look
      # healthy while every Docker-backed view/poller is dead. The operator
      # command derives the mounted socket's real numeric group.
      - "${DOCKER_GID:?run bin/fleet-dashboard so the Docker socket GID is detected}"
    security_opt:
      - no-new-privileges:true
    # Verified across this fleet: nothing here needs a Linux capability, and
    # socket access comes from group membership, not capabilities.
    cap_drop:
      - ALL
    # Loopback-only publish — same posture as cron-manager / domain-developer.
    ports:
      - "127.0.0.1:4754:4754"
    # FD_TOKEN + SOCIAL_HUB_TOKEN come from the env-broker's scoped render, not
    # the shared fleet .env (B2): the token that gates this panel — which holds
    # the Docker socket and can push to all 48 repos — has no business sitting
    # in the same bootstrap file as 60 other keys. Vaultwarden is its home;
    # `env_broker.py --source vault render --all` writes this file 0400.
    # Regenerate with: tools/env-broker/env_broker.py render --all
    env_file:
      - ${HOME:-/home/jesse}/projects/domains/tools/env-broker/rendered/tool-fleet-dashboard.env
    environment:
      # Repo root, bind-mounted at the SAME absolute path inside the container
      # so the engineer-status.py audit resolves sites/* correctly and the
      # git/task file paths line up with the host.
      FD_DOMAINS_ROOT: ${HOME:-/home/jesse}/projects/domains
      FD_HOST: 0.0.0.0
      # FD_TOKEN and FD_AUTH are NOT set here on purpose: an `environment:` entry
      # overrides `env_file:`, so listing them would shadow the scoped render
      # above with a shell/.env value. This panel mounts the docker socket AND
      # joins the shared vpn_proxy network, so any container on that network can
      # reach it — the token is the only real gate (B2). bin/fleet-dashboard
      # refuses to start without one; FD_AUTH=0 in the rendered file is the
      # explicit off switch, and anything else (including unset) keeps it on.
      HOME: ${HOME:-/home/jesse}
      DATAHUB_API: http://datahub-api:4760
      DATAHUB_IMAGES_API: http://datahub-images-api:4770
      PRODUCTFEED_API: http://product-feed-api:4761
      # Social Hub shares vpn_proxy with the dashboard, so use its stable
      # container DNS name. The host publish remains loopback-only for local
      # operators; browsers never receive the hub token.
      SOCIALHUB_API: ${SOCIALHUB_API:-http://social-hub-api:4772}
      SOCIALHUB_PUBLIC_URL: ${SOCIALHUB_PUBLIC_URL:-http://127.0.0.1:4772}
      # SOCIAL_HUB_TOKEN also arrives via env_file: above — see the note there.
      # Every site repo in the fleet pushes over the same github-bourneash SSH
      # identity (confirmed across sites — one shared account). -F /dev/null
      # skips ~/.ssh/config entirely: root's default config-file lookup is
      # /root/.ssh/config, and OpenSSH's strict ownership check on that file
      # rejected it back when this ran as root. It now runs as uid 1000, which
      # matches the mounted files' owner, but the explicit form is kept because
      # -F /dev/null also discards the host's ~/.ssh/config. Every remote URL
      # uses the literal host "github-bourneash" (the host's ~/.ssh/config
      # alias for github.com) — since -F /dev/null also throws away that
      # alias's HostName mapping, -o HostName=github.com restores it directly.
      # Matches the same explicit-identity pattern every site's own cron
      # containers already use.
      GIT_SSH_COMMAND: "ssh -F /dev/null -i /home/node/.ssh/github-bourneash -o UserKnownHostsFile=/home/node/.ssh/known_hosts -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o HostName=github.com"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - vpn_proxy
      - product_feed
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME:-/home/jesse}/projects/domains:${HOME:-/home/jesse}/projects/domains
      # Git push/pull over SSH remotes (git@github-bourneash:...) needs the
      # host's keys/config/known_hosts — read-only, same pattern every
      # site's own cron containers already use for git push. The container
      # runs as root (see Dockerfile), and OpenSSH resolves ~/.ssh via the
      # passwd-database home dir (/root), NOT the $HOME env override used
      # elsewhere in this compose file for path-matching — so this must be
      # mounted at /root/.ssh specifically, not at $HOME/.ssh.
      - ${HOME:-/home/jesse}/.ssh:/home/node/.ssh:ro
      # Dev Sandboxes tab (folded in from the standalone domain-developer
      # tool): spawned per-site worker containers get their Claude project
      # dir bind-mounted RW here so per-site memory/transcripts land on the
      # host, and share plugins/commands/hooks/skills/settings from the
      # operator's own ~/.claude RO. This panel's OWN process only needs
      # existsSync on these before deciding what to pass through to workers
      # — same posture domain-developer's panel had, just relocated.
      - ${HOME:-/home/jesse}/.claude/projects:${HOME:-/home/jesse}/.claude/projects
      - ${HOME:-/home/jesse}/.claude:${HOME:-/home/jesse}/.claude:ro
    working_dir: ${HOME:-/home/jesse}/projects/domains/tools/fleet-dashboard

networks:
  default:
  product_feed:
    external: true
    name: product-feed_default
  vpn_proxy:
    external: true
    name: vpn-proxy_default
