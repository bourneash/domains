[project]
name = "social-setup"
version = "0.1.0"
description = "Automated social media account provisioner for the domain portfolio"
requires-python = ">=3.11"
dependencies = [
    "cloakbrowser",
    "click>=8.0",
    "httpx",
    "rich",
]

[project.scripts]
social-setup = "social_setup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
