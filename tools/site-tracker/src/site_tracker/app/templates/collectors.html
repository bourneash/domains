{% extends "base.html" %}
{% block breadcrumbs %}<a href="/">matrix</a> <span class="bc-sep">›</span> collectors{% endblock %}
{% block body %}
<h2>Collectors</h2>
<table>
  <thead><tr><th>name</th><th>action</th></tr></thead>
  <tbody>
    {% for c in collectors %}
    <tr>
      <td class="site">{{ c }}</td>
      <td>
        <button hx-post="/collectors/{{ c }}/run" hx-target="this" hx-swap="outerHTML">run</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
