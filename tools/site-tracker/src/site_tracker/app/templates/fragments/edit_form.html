{% if key == "manual.new" %}
<td colspan="2" class="edit-form">
{% else %}
<td class="edit-form">
{% endif %}
  <form hx-post="/site/{{ site }}/edit/{{ key }}" hx-target="closest tr" hx-swap="outerHTML">
    {% if key == "manual.new" %}
      <input type="text" name="key" placeholder="key (e.g. adsense_status)" required
             pattern="[-a-zA-Z0-9._]+" title="letters, numbers, '.', '_', '-' only — no spaces or slashes">
    {% endif %}
    <input type="text" name="value" value="{{ current }}" maxlength="500" autofocus required>
    <button type="submit">save</button>
  </form>
  {% if key != "manual.new" %}
  <button type="button" class="delete-btn"
          hx-delete="/site/{{ site }}/edit/{{ key }}"
          hx-target="closest tr" hx-swap="outerHTML"
          hx-confirm="Delete {{ key }} for {{ site }}?">delete</button>
  {% endif %}
</td>
