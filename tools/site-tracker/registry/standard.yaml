# Standard fact catalog for tools/site-tracker.
#
# Each fact is keyed by its dotted name (e.g. "cf.zone_active") and has:
#   family:      grouping for the matrix column (cf, http, sitemap, tls, git, ops, github, manual)
#   source:      who populated it — collector module name or "manual"
#   ttl_hours:   freshness window; after this the state degrades to 'stale' at read time
#   describe:    short human-readable description
#   state_rule:  named evaluator from fact_keys.py:
#                  bool_green_red       — True→green, False→red, None→unknown
#                  bool_green_yellow    — True→green, False→yellow, None→unknown
#                  tls_expiry           — numeric days; <7=red, <30=yellow, else green
#                  commit_age           — hours; active sites <168h=green, <720=yellow, else red; parked sites always green
#                  push_age             — hours; <168=green, <720=yellow, else red (no active-site exception)
#                  ops_board_age        — hours; <25=green, <72=yellow, else red
#                  commits_ahead        — int; 0=green, <5=yellow, else red
#
# Adding a new fact: copy a block below, rename the key, fill in describe + state_rule.
# Adding a new state rule: define it in fact_keys.py and reference its name here.

facts:
  # Cloudflare
  cf.zone_active:
    family: cf
    source: cf_api
    ttl_hours: 6
    describe: Zone active in Cloudflare
    state_rule: bool_green_red
  cf.worker_bound:
    family: cf
    source: cf_api
    ttl_hours: 6
    describe: Worker bound to zone
    state_rule: bool_green_yellow
  cf.email_routing:
    family: cf
    source: cf_api
    ttl_hours: 24
    describe: Email routing configured
    state_rule: bool_green_yellow

  # Canary / smoke-string
  canary.smoke_ok:
    family: canary
    source: canary
    ttl_hours: 25
    describe: Smoke string present in live homepage (catches silent broken deploys)
    state_rule: bool_green_red

  # HTTP scrape
  http.ga4_present:
    family: http
    source: http_scrape
    ttl_hours: 24
    describe: GA4 tag in <head>
    state_rule: bool_green_yellow
  http.adsense_present:
    family: http
    source: http_scrape
    ttl_hours: 24
    describe: AdSense tag in <head>
    state_rule: bool_green_yellow
  http.meta_pixel_present:
    family: http
    source: http_scrape
    ttl_hours: 24
    describe: Meta Pixel in <head>
    state_rule: bool_green_yellow
  http.gtm_present:
    family: http
    source: http_scrape
    ttl_hours: 24
    describe: GTM tag in <head>
    state_rule: bool_green_yellow
  http.sitemap_200:
    family: sitemap
    source: http_scrape
    ttl_hours: 24
    describe: GET /sitemap.xml returns 200
    state_rule: bool_green_red
  http.robots_present:
    family: sitemap
    source: http_scrape
    ttl_hours: 24
    describe: GET /robots.txt returns 200
    state_rule: bool_green_yellow
  http.tls_expiry_days:
    family: tls
    source: http_scrape
    ttl_hours: 24
    describe: Days until TLS cert expires
    state_rule: tls_expiry

  # SEO essentials (head)
  http.has_canonical:
    family: seo
    source: recipes
    ttl_hours: 24
    describe: <link rel="canonical"> present in head
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_head
      pattern: '<link[^>]+rel=["'']canonical["'']'

  http.has_og_tags:
    family: seo
    source: recipes
    ttl_hours: 24
    describe: Open Graph meta tags present (og:title etc.)
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_head
      pattern: 'property=["'']og:(title|image|description)["'']'

  http.has_schema_org:
    family: seo
    source: recipes
    ttl_hours: 24
    describe: schema.org structured data present (JSON-LD or microdata)
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_head
      pattern: 'application/ld\+json|itemscope'

  http.has_viewport_meta:
    family: seo
    source: recipes
    ttl_hours: 24
    describe: <meta name="viewport"> present (mobile-friendly)
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_head
      pattern: 'name=["'']viewport["'']'

  http.has_rss:
    family: seo
    source: recipes
    ttl_hours: 24
    describe: RSS/Atom feed linked from head
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_head
      pattern: 'type=["''](application/(rss|atom)\+xml)["'']'

  # Ads / monetization
  http.has_ads_txt:
    family: ads
    source: recipes
    ttl_hours: 24
    describe: /ads.txt published (IAB ad inventory authentication)
    state_rule: bool_green_yellow
    recipe:
      type: path_status
      path: /ads.txt
      expected: 200

  # Contact / discoverability
  http.has_contact_email:
    family: contact
    source: recipes
    ttl_hours: 24
    describe: "Site has a mailto: link"
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_head
      pattern: 'mailto:[\w\.\-+]+@'

  # Legal / trust signals
  http.has_privacy_page:
    family: legal
    source: recipes
    ttl_hours: 24
    describe: "GET /privacy returns 200"
    state_rule: bool_green_yellow
    recipe:
      type: path_status
      path: /privacy
      expected: 200

  http.has_terms_page:
    family: legal
    source: recipes
    ttl_hours: 24
    describe: GET /terms returns 200
    state_rule: bool_green_yellow
    recipe:
      type: path_status
      path: /terms
      expected: 200

  http.has_security_txt:
    family: legal
    source: recipes
    ttl_hours: 24
    describe: GET /.well-known/security.txt returns 200
    state_rule: bool_green_yellow
    recipe:
      type: path_status
      path: /.well-known/security.txt
      expected: 200

  http.has_affiliate_disclosure:
    family: legal
    source: recipes
    ttl_hours: 24
    describe: Page body mentions affiliate / Amazon Associates disclosure
    state_rule: bool_green_yellow
    recipe:
      type: regex_on_body
      pattern: 'amazon associate|affiliate (link|disclosure)|earn.{0,40}commission'

  # Branding
  http.has_favicon:
    family: branding
    source: recipes
    ttl_hours: 24
    describe: "GET /favicon.ico returns 200"
    state_rule: bool_green_yellow
    recipe:
      type: path_status
      path: /favicon.ico
      expected: 200

  http.has_about_page:
    family: branding
    source: recipes
    ttl_hours: 24
    describe: GET /about returns 200
    state_rule: bool_green_yellow
    recipe:
      type: path_status
      path: /about
      expected: 200

  # Filesystem
  fs.last_commit_age_hours:
    family: git
    source: filesystem
    ttl_hours: 1
    describe: Hours since last commit on main
    state_rule: commit_age
  fs.ops_board_last_run_age_hours:
    family: ops
    source: filesystem
    ttl_hours: 1
    describe: Hours since latest ops/board/last-run.json
    state_rule: ops_board_age

  # Amazon affiliate health
  amz.asin_count:
    family: amz
    source: amazon
    ttl_hours: 25
    describe: Total affiliate ASINs registered for this site
    state_rule: amz_asin_count
  amz.oos_count:
    family: amz
    source: amazon
    ttl_hours: 25
    describe: ASINs currently out of stock on Amazon
    state_rule: amz_oos_count
  amz.delisted_count:
    family: amz
    source: amazon
    ttl_hours: 25
    describe: ASINs no longer returned by Amazon API (likely delisted)
    state_rule: amz_delisted_count
  amz.last_scan:
    family: amz
    source: amazon
    ttl_hours: 25
    describe: Timestamp of last amz-stats catalog snapshot
    state_rule: amz_last_scan

  # GitHub
  github.commits_ahead:
    family: github
    source: github_api
    ttl_hours: 24
    describe: Local commits not on origin
    state_rule: commits_ahead
  github.last_push_age_hours:
    family: github
    source: github_api
    ttl_hours: 24
    describe: Hours since last push to origin
    state_rule: push_age

# Canonical column order for the matrix.
families:
  - canary
  - cf
  - http
  - seo
  - sitemap
  - tls
  - git
  - ops
  - github
  - amz
  - ads
  - contact
  - legal
  - branding
  - manual
