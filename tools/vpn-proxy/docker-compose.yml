# tools/vpn-proxy — multi-location PIA VPN proxy for fleet scrapers.
#
# Bring up:       docker compose up -d
# Check health:   ./check-health.sh
# Logs:           docker compose logs -f vpn-us
# Stop:           docker compose down
#
# Scrapers use:
#   HTTP_PROXY=http://127.0.0.1:8181   (US exit)
#   HTTP_PROXY=http://127.0.0.1:8182   (EU exit)
#   HTTP_PROXY=http://127.0.0.1:8183   (random global exit, rotates every 15m)
#
# Required vars in /home/jesse/projects/domains/.env (see .env.example):
#   VPN_PIA_USERNAME, VPN_PIA_PASSWORD, VPN_REGION_US, VPN_REGION_EU

name: vpn-proxy

x-vpn-base: &vpn-base
  image: qmcgaw/gluetun:latest
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  labels:
    autoheal: "true"   # picked up by the autoheal watchdog
  logging:
    driver: local
    options:
      max-size: "2m"    # 2MB cap — old lines evicted as new ones arrive
      max-file: "1"     # single file, never accumulates across restarts
      compress: "false"
  healthcheck:
    # gluetun ships its own healthcheck binary — checks tunnel state, not just process
    test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
    interval: 1m
    timeout: 10s
    retries: 5          # 5 × 1m = 5 min before autoheal triggers restart
    start_period: 60s

services:

  # ── US exit node ────────────────────────────────────────────────────────────
  vpn-us:
    <<: *vpn-base
    container_name: vpn-us
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      VPN_TYPE: openvpn
      OPENVPN_USER: ${VPN_PIA_USERNAME:?set VPN_PIA_USERNAME in .env}
      OPENVPN_PASSWORD: ${VPN_PIA_PASSWORD:?set VPN_PIA_PASSWORD in .env}
      SERVER_REGIONS: ${VPN_REGION_US:-US East}

      # HTTP proxy (built into gluetun — no sidecar needed)
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"

      # DNS-over-TLS — prevents DNS leaks; cloudflare is the default provider
      DOT: "on"
      DOT_PROVIDERS: cloudflare

      # Kill switch is ON by default in gluetun (iptables blocks non-VPN egress)
      # Firewall allows LAN subnets so localhost proxy connections still work
      FIREWALL_INPUT_PORTS: "8888"

      # Server list auto-update
      UPDATER_PERIOD: 24h
      TZ: UTC
    ports:
      - "127.0.0.1:8181:8888"  # HTTP proxy — scrapers use this
      - "127.0.0.1:9281:8000"  # gluetun control/health API

  # ── EU exit node ────────────────────────────────────────────────────────────
  vpn-eu:
    <<: *vpn-base
    container_name: vpn-eu
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      VPN_TYPE: openvpn
      OPENVPN_USER: ${VPN_PIA_USERNAME:?set VPN_PIA_USERNAME in .env}
      OPENVPN_PASSWORD: ${VPN_PIA_PASSWORD:?set VPN_PIA_PASSWORD in .env}
      SERVER_REGIONS: ${VPN_REGION_EU:-Netherlands}

      HTTPPROXY: "on"
      HTTPPROXY_LOG: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"

      DOT: "on"
      DOT_PROVIDERS: cloudflare

      FIREWALL_INPUT_PORTS: "8888"

      UPDATER_PERIOD: 24h
      TZ: UTC
    ports:
      - "127.0.0.1:8182:8888"  # HTTP proxy — scrapers use this
      - "127.0.0.1:9282:8000"  # gluetun control/health API

  # ── Random global exit node ─────────────────────────────────────────────────
  # Leaving SERVER_REGIONS unset lets Gluetun choose from the full PIA server
  # list. The controller below asks Gluetun to stop/start only its VPN tunnel
  # every 15 minutes; the container and proxy listener stay in place.
  vpn-random:
    <<: *vpn-base
    container_name: vpn-random
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      VPN_TYPE: openvpn
      OPENVPN_USER: ${VPN_PIA_USERNAME:?set VPN_PIA_USERNAME in .env}
      OPENVPN_PASSWORD: ${VPN_PIA_PASSWORD:?set VPN_PIA_PASSWORD in .env}

      # Deliberately no SERVER_REGIONS/SERVER_COUNTRIES filter: use all PIA
      # locations so each reconnect can select a different global exit.
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"

      DOT: "on"
      DOT_PROVIDERS: cloudflare
      FIREWALL_INPUT_PORTS: "8888"

      UPDATER_PERIOD: 24h
      TZ: UTC
      # Keep the control API private even to other Docker-network peers.
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${VPN_RANDOM_CONTROL_API_KEY:?set VPN_RANDOM_CONTROL_API_KEY in .env}"}'
    ports:
      - "127.0.0.1:8183:8888"  # HTTP proxy — random global exit
      - "127.0.0.1:9283:8000"  # gluetun control/health API

  # Tunnel rotation is intentionally separate from Gluetun. It does not
  # recreate or restart vpn-random, which avoids dropping the proxy socket and
  # preserves the container's network identity for its consumers.
  vpn-random-rotator:
    image: qmcgaw/gluetun:latest
    container_name: vpn-random-rotator
    restart: unless-stopped
    depends_on:
      vpn-random:
        condition: service_started
    environment:
      ROTATION_INTERVAL_SECONDS: ${VPN_RANDOM_ROTATION_SECONDS:-900}
      GLUETUN_CONTROL_URL: http://vpn-random:8000
      GLUETUN_CONTROL_API_KEY: ${VPN_RANDOM_CONTROL_API_KEY:?set VPN_RANDOM_CONTROL_API_KEY in .env}
    volumes:
      - ./rotate-random.sh:/rotate-random.sh:ro
    entrypoint: ["/bin/sh", "/rotate-random.sh"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Autoheal watchdog ───────────────────────────────────────────────────────
  # Watches for containers with label autoheal=true that go unhealthy and
  # restarts them. Covers the case where gluetun's VPN tunnel drops but the
  # container doesn't exit (so restart: unless-stopped alone can't catch it).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: vpn-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal   # only restart containers with this label
      AUTOHEAL_INTERVAL: 60                # check every 60s
      AUTOHEAL_START_PERIOD: 60            # grace period before first check (seconds)
      CURL_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Override the willfarrell/autoheal image's built-in 5s HEALTHCHECK, which
    # was firing a runc exec every 5s. The watchdog interval itself is
    # AUTOHEAL_INTERVAL above (30s); this just controls its own liveness probe.
    #
    # The predicate reads PID 1's cmdline rather than using `pgrep -f autoheal`,
    # which was UNFAILABLE: `-f` matches the whole command line, and the
    # probe's own `sh -c "pgrep -f autoheal ..."` contains the string, so pgrep
    # always found itself and exited 0 — this container reported healthy no
    # matter what. Verified in place: `pgrep -f NOSUCHPROCXYZ` also exited 0.
    # PID 1 here is `sh /docker-entrypoint autoheal`, so match on cmdline
    # (-a: treat the NUL-separated file as text) rather than /proc/1/comm,
    # which is just `sh`. Same defect and same class of fix as every site's
    # cron container — see any sites/*/docker-compose.yml.
    healthcheck:
      test: ["CMD", "grep", "-qa", "autoheal", "/proc/1/cmdline"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 60s
