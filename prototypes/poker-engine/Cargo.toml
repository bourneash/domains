[package]
name = "poker-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "flopbench"
path = "src/bin/flopbench.rs"

[[bin]]
name = "solve_preflop"
path = "src/bin/solve_preflop.rs"
